
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Program/Course Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #eef2ff, #fce7f3);
        }

        .login-container {
            width: 100%;
            max-width: 950px;
            min-height: 540px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(60, 50, 120, 0.15);
        }

        .welcome-panel {
            background: linear-gradient(135deg, #4f46e5, #8b5cf6, #ec4899);
            color: white;
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-panel h1 {
            font-size: 35px;
            margin-bottom: 18px;
        }

        .welcome-panel p {
            line-height: 1.8;
            font-size: 15px;
        }

        .welcome-icon {
            font-size: 75px;
            margin-bottom: 25px;
        }

        .form-panel {
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-panel h2 {
            color: #312e81;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #4f46e5, #a855f7);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .register-link a,
        .back-link {
            color: #6d28d9;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .login-container {
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                padding: 35px 30px;
                text-align: center;
            }

            .welcome-panel h1 {
                font-size: 28px;
            }

            .welcome-icon {
                font-size: 50px;
                margin-bottom: 15px;
            }

            .form-panel {
                padding: 35px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="welcome-panel">
            <div class="welcome-icon">🎓</div>
            <h1>Welcome Back!</h1>
            <p>
                Continue your journey with .
                Discover academic programs that match your interests,
                skills, and future career goals.
            </p>
        </div>

        <div class="form-panel">
            <h2>Log In</h2>
            <p class="subtitle">Enter your account details to continue.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="login-button">
                    Log In
                </button>
            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Your login form is working! Account verification will be added when we connect the database.");
        });
    </script>

</body>
</html>
