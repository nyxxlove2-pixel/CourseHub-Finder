
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Program/Course Finder</title>

    <link rel="stylesheet" href="/assets/login.css"/>   
</head>

<body>

    <div class="login-container">

        <div class="welcome-panel">
            <div class="welcome-icon">🎓</div>
            <h1>Welcome Back!</h1>
            <p>
                Continue your journey with .
                Discover academic programs that match your interests,
                skills, and future career goals.
            </p>
        </div>

        <div class="form-panel">
            <h2>Log In</h2>
            <p class="subtitle">Enter your account details to continue.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="login-button">
                    Log In
                </button>
            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Your login form is working! Account verification will be added when we connect the database.");
        });
    </script>

</body>
</html>
